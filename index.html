<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário!</title>
    <link rel="stylesheet" href="_css/style.css">
</head>

<body>
    <form>
        <header>
            <h1>Exemplos de Formulário em HTML</h1>
            <hr>
        </header>
        <div class="div1">
            <h3>Exemplo 01</h3>
            <input type="text" placeholder="Nome">
            <input type="mail" placeholder="Email">
            <input type="tel" placeholder="Celular">
            <input type="password" placeholder="Senha">
            <input type="submit" value="Cadastrar">
            <hr>
        </div>
        <div class="div2">
            <h3>Exemplo 02</h3>
            <textarea></textarea>
            <hr>
        </div>
        <div class="div3">
            <h3>Exemplo 03</h3>
            <fieldset>
                <legend>Formulário</legend>
                Nome: <input type="text">
                <p></p>
                Sexo: <input type="radio" value="Masculino"> Masculino
                <input type="radio" value="Feminino"> Feminino
                <p></p>
                País <select>
                    <option>Selecione uma opção</option>
                    <option>Brasil</option>
                    <option>Portugal</option>
                    <option>Moçambique</option>
                    <option>Angola</option>
                    <option>Cabo Verde</option>
                    <option>Macau</option>
                    <option>Guiné-Bissau</option>
                </select>
                <p></p>
                Mensagem: <br>
                <textarea></textarea>
                <p></p>
                <input type="checkbox"> Assinar Newsletter?
                <p></p>
                <input type="submit" value="Enviar">
            </fieldset>
            <hr>
        </div>
        <search>
            <h3>Exemplo 4</h3>
            <div class="div4">
            <textarea></textarea> <input type="submit" value="Clique para pesquisar">
            </div>
            <hr>
        </search>
        <div class="div5">
            <h3>Exemplo 05</h3>
            <fieldset>
                <legend>Selecione a cor que mais agrada?</legend>
                <input type="checkbox"> azul
                <input type="checkbox"> vermelho
                <input type="checkbox"> verde
                <input type="checkbox"> amarelo
            </fieldset>
        </div>
    </form>
</body>

</html>
